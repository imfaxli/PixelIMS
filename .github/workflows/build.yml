name: Build PixelIMS APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Specific Gradle Version
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.9'

    - name: Fix version catalog duplicate call in settings
      run: |
        if [ -f "settings.gradle.kts" ]; then
          # Retain only the first occurrence of 'from(' in settings.gradle.kts if duplicated
          awk '/from\(/{c++} c>1 && /from\(/{next} 1' settings.gradle.kts > settings.tmp && mv settings.tmp settings.gradle.kts
        elif [ -f "settings.gradle" ]; then
          awk '/from\(/{c++} c>1 && /from\(/{next} 1' settings.gradle > settings.tmp && mv settings.tmp settings.gradle
        fi

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace --no-daemon
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: PixelIMS-debug
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
